    <div class="contactMePage">

        <h1 class="projectsHeading">Contact Me</h1>
        
        <form action="https://formspree.io/f/mvzyalqk" method="POST">
            <div class="contact-form-group">
                <label for="name"> Name:</label>
                <input type="text" id = "name" name="name" required>
            </div>
            <div class="contact-form-group">
                <label for="email"> Email:</label>
                <input type="email" id = "email" name="email" required>
            </div>
            <div class="contact-form-group">
                <label for="subject"> Subject:</label>
                <input type="text" id = "subject" name="subject" required>
            </div>
            <div class="contact-form-group">
                <label for="message"> Message:</label>
                <textarea id = "message" name="message" rows="5" cols="60" autocomplete="off" required></textarea>
            </div>
            <button type="submit" onclick="sendMail()">Send Email</button>
        </form>
		
	</div>
    
</body>
